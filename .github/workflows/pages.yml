name: CI and Pages

# Every push runs the rules tests and the production build, so a wrong 5e
# number or a type error never reaches main quietly, and a green build on main
# publishes itself.
#
# Cut over from the prototype on 2026-10-09: Pages' source is now "GitHub
# Actions" rather than the gh-pages branch, and the deploy job runs on every
# push to main. Because lint, tests and the build all gate it, a red commit
# never reaches the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # Publishable values only. The Anthropic key lives in Supabase
          # secrets and is never part of a build.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_HOSTED_BASE: ${{ vars.VITE_HOSTED_BASE }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    # Only from main — a pull request builds and is checked, but never deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
